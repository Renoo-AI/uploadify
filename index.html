<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropLink | GitHub Uploader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: {} } }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .drag-active { border-color: #60a5fa !important; background: rgba(59, 130, 246, 0.1) !important; transform: scale(1.02); }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height: 100vh; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="antialiased flex flex-col relative overflow-x-hidden">

    <!-- Header -->
    <nav class="w-full glass-panel sticky top-0 z-50 shadow-2xl">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-link text-white text-sm"></i>
                </div>
                <span class="font-bold tracking-tight text-xl text-white">DropLink</span>
            </div>
            <div class="flex gap-6 text-sm font-medium">
                <a href="index.html" class="text-blue-400 border-b-2 border-blue-400 py-5">Upload</a>
                <a href="gallery.html" class="text-slate-400 hover:text-white transition-colors py-5">Gallery</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center p-6 w-full max-w-3xl mx-auto relative z-10">

        <!-- Background Orbs -->
        <div class="absolute top-10 left-10 w-64 h-64 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
        <div class="absolute top-10 right-10 w-64 h-64 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-8 left-20 w-64 h-64 bg-indigo-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-4000"></div>

        <div class="w-full relative">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-center mb-2 tracking-tight">Store files on <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400">GitHub</span></h1>
            <p class="text-slate-400 text-center mb-10 text-sm">Instant raw URLs. Zero servers. Direct API upload.</p>

            <!-- Uploader Area -->
            <div id="dropzone" class="glass-panel w-full rounded-3xl p-12 flex flex-col items-center justify-center cursor-pointer border-2 border-dashed border-slate-600 hover:border-blue-500 hover:bg-slate-800/50 transition-all duration-300 shadow-2xl group">
                <input type="file" id="fileInput" multiple class="hidden" accept="*">

                <div class="w-20 h-20 bg-slate-800/80 rounded-full flex items-center justify-center mb-6 group-hover:scale-110 group-hover:bg-blue-900/40 transition-all duration-300 shadow-inner">
                    <i class="fa-solid fa-cloud-arrow-up text-3xl text-blue-400 group-hover:text-blue-300 transition-colors"></i>
                </div>

                <h3 class="text-xl font-bold text-white mb-2">Drag & Drop files</h3>
                <p class="text-slate-400 text-sm mb-6">or click to browse</p>

                <button id="browseBtn" class="bg-white/10 hover:bg-white/20 text-white px-6 py-2.5 rounded-xl font-medium transition-colors shadow-lg border border-white/5 backdrop-blur-sm">
                    Select Files
                </button>
            </div>

            <!-- Upload Queue -->
            <div id="uploadQueue" class="w-full mt-8 space-y-4">
                <!-- Items injected here -->
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

    <script src="config.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dropzone = document.getElementById('dropzone');
            const fileInput = document.getElementById('fileInput');
            const browseBtn = document.getElementById('browseBtn');
            const uploadQueue = document.getElementById('uploadQueue');

            // Handle UI events
            browseBtn.addEventListener('click', (e) => { e.stopPropagation(); fileInput.click(); });
            dropzone.addEventListener('click', () => fileInput.click());

            // Drag events
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
                dropzone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); });
            });
            ['dragenter', 'dragover'].forEach(evt => dropzone.addEventListener(evt, () => dropzone.classList.add('drag-active')));
            ['dragleave', 'drop'].forEach(evt => dropzone.addEventListener(evt, () => dropzone.classList.remove('drag-active')));

            dropzone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
            fileInput.addEventListener('change', function() { handleFiles(this.files); this.value = ''; });

            async function handleFiles(files) {
                for (let file of files) {
                    if (file.size > 20 * 1024 * 1024) { // 20MB limit for API stability
                        showToast(`File ${file.name} exceeds 20MB limit`, 'error');
                        continue;
                    }
                    await processUpload(file);
                }
            }

            async function processUpload(file) {
                const queueId = 'queue-' + Math.random().toString(36).substr(2, 9);

                // Add UI Element
                const itemHTML = `
                    <div id="${queueId}" class="glass-panel p-5 rounded-2xl flex flex-col gap-3 transition-all duration-300 border border-slate-700">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3 overflow-hidden">
                                <div class="w-10 h-10 rounded-lg bg-slate-800 flex items-center justify-center shrink-0">
                                    <i class="fa-solid fa-file text-slate-400"></i>
                                </div>
                                <span class="font-medium text-sm truncate text-slate-200 max-w-[200px] sm:max-w-xs">${file.name}</span>
                            </div>
                            <span class="text-xs font-semibold text-blue-400 status-text bg-blue-500/10 px-2 py-1 rounded-md">Initializing...</span>
                        </div>

                        <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                            <div class="progress-bar bg-gradient-to-r from-blue-500 to-indigo-500 h-1.5 rounded-full w-0 transition-all duration-300"></div>
                        </div>

                        <div class="result-area hidden mt-1 flex items-center gap-2">
                            <input type="text" readonly class="url-input flex-grow bg-slate-900/50 border border-slate-700 text-xs rounded-lg px-3 py-2 text-slate-300 focus:outline-none focus:border-blue-500 font-mono" value="">
                            <button class="copy-btn bg-slate-700 hover:bg-slate-600 text-white p-2 rounded-lg transition-colors" title="Copy URL">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                            <a href="#" target="_blank" class="view-btn bg-blue-600/20 hover:bg-blue-600/40 text-blue-400 p-2 rounded-lg transition-colors" title="Open File">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            </a>
                        </div>
                    </div>
                `;
                uploadQueue.insertAdjacentHTML('afterbegin', itemHTML);

                const el = document.getElementById(queueId);
                const progress = el.querySelector('.progress-bar');
                const status = el.querySelector('.status-text');
                const result = el.querySelector('.result-area');

                // Upload via API
                const response = await uploadFileToGitHub(file, (percent) => {
                    progress.style.width = percent + '%';
                    if(percent === 10) status.textContent = "Converting...";
                    if(percent === 50) status.textContent = "Uploading...";
                    if(percent === 100) status.textContent = "Done";
                });

                if (response.success) {
                    status.classList.replace('text-blue-400', 'text-emerald-400');
                    status.classList.replace('bg-blue-500/10', 'bg-emerald-500/10');
                    progress.classList.replace('from-blue-500', 'from-emerald-500');
                    progress.classList.replace('to-indigo-500', 'to-teal-500');

                    result.classList.remove('hidden');
                    el.querySelector('.url-input').value = response.url;
                    el.querySelector('.view-btn').href = response.url;

                    // Auto copy
                    copyToClipboard(response.url);
                    showToast('Uploaded & Copied to clipboard!', 'success');

                    el.querySelector('.copy-btn').addEventListener('click', () => {
                        copyToClipboard(response.url);
                        showToast('Copied URL', 'success');
                    });
                } else {
                    status.textContent = "Failed";
                    status.classList.replace('text-blue-400', 'text-red-400');
                    status.classList.replace('bg-blue-500/10', 'bg-red-500/10');
                    progress.classList.replace('from-blue-500', 'from-red-500');
                    progress.classList.replace('to-indigo-500', 'to-orange-500');
                    showToast(response.error, 'error');
                }
            }
        });
    </script>
</body>
</html>
